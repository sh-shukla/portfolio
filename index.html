    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before first paint: saved choice, else the OS setting.
      (function () {
        var dark = false;
        try {
          var t = localStorage.getItem("theme");
          dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {
          dark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        }
        var root = document.documentElement;
        if (dark) root.classList.add("dark");
        root.style.colorScheme = dark ? "dark" : "light";
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
      })();
    </script>
